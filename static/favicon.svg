<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Brand Flame/Glow Gradient: Swiggy Orange to Zomato Red -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FC8019"/>
      <stop offset="50%" stop-color="#E23744"/>
      <stop offset="100%" stop-color="#CB202D"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Base App Icon Rounded Box -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Outer Dashed Ring -->
  <circle cx="256" cy="245" r="150" fill="none" stroke="url(#brandGrad)" stroke-width="12" stroke-dasharray="24 16"/>

  <!-- Main Brand Gradient Circle -->
  <circle cx="256" cy="245" r="125" fill="url(#brandGrad)"/>

  <!-- CUTLERY: FORK & SPOON SIDE BY SIDE -->
  <g fill="#FFFFFF" transform="translate(160, 150)">
    <!-- FORK (LEFT) -->
    <path d="M 28 15 L 28 45 C 28 58 38 62 43 62 L 43 125 C 43 129 46 132 50 132 C 54 132 57 129 57 125 L 57 62 C 62 62 72 58 72 45 L 72 15 C 72 12 70 10 67 10 C 64 10 62 12 62 15 L 62 38 L 54 38 L 54 15 C 54 12 52 10 49 10 C 46 10 44 12 44 15 L 44 38 L 36 38 L 36 15 C 36 12 34 10 31 10 C 28 10 28 12 28 15 Z"/>

    <!-- SPOON (RIGHT) -->
    <path d="M 145 10 C 122 10 110 32 110 50 C 110 65 124 72 138 72 L 138 125 C 138 129 141 132 145 132 C 149 132 152 129 152 125 L 152 72 C 166 72 180 65 180 50 C 180 32 168 10 145 10 Z"/>
  </g>

  <!-- Green Checkmark Badge at Bottom-Right -->
  <g transform="translate(325, 315)">
    <circle cx="35" cy="35" r="42" fill="url(#emeraldGrad)" stroke="#FFFFFF" stroke-width="5"/>
    <path d="M 20 35 L 30 45 L 50 25" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
